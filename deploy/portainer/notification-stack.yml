services:
  lens-notification:
    container_name: lens-notification
    image: '${NOTIFICATION_IMAGE:-ghcr.io/${IMAGE_OWNER:-lensexe}/lens-notification:${IMAGE_TAG:-latest}}'
    pull_policy: '${NOTIFICATION_PULL_POLICY:-always}'
    environment:
      NODE_ENV: '${NODE_ENV:-production}'
      PORT: '${PORT:-3001}'

      KAFKA_ENABLED: '${KAFKA_ENABLED:-true}'
      KAFKA_BROKERS: '${KAFKA_BROKERS:-kafka:9094}'
      KAFKA_CLIENT_ID: '${KAFKA_CLIENT_ID:-notification-service}'
      KAFKA_GROUP_ID: '${KAFKA_GROUP_ID:-notification-service}'
      KAFKA_NOTIFICATION_EVENTS_TOPIC: '${KAFKA_NOTIFICATION_EVENTS_TOPIC:-notification.events}'
      KAFKA_NOTIFICATION_EVENTS_DLQ_TOPIC: '${KAFKA_NOTIFICATION_EVENTS_DLQ_TOPIC:-notification.events.dlq}'
      KAFKA_FROM_BEGINNING: '${KAFKA_FROM_BEGINNING:-false}'
      KAFKA_MAIL_COMMANDS_TOPIC: '${KAFKA_MAIL_COMMANDS_TOPIC:-notification.mail.commands.v1}'
      KAFKA_MAIL_COMMANDS_DLQ_TOPIC: '${KAFKA_MAIL_COMMANDS_DLQ_TOPIC:-notification.mail.commands.v1.dlq}'
      KAFKA_MAIL_COMMANDS_GROUP_ID: '${KAFKA_MAIL_COMMANDS_GROUP_ID:-notification-mail}'
      KAFKA_MAIL_COMMANDS_FROM_BEGINNING: '${KAFKA_MAIL_COMMANDS_FROM_BEGINNING:-false}'
      KAFKA_CHAT_EVENTS_TOPIC: '${KAFKA_CHAT_EVENTS_TOPIC:-chat.conversation.events.v1}'
      KAFKA_CHAT_EVENTS_DLQ_TOPIC: '${KAFKA_CHAT_EVENTS_DLQ_TOPIC:-chat.conversation.events.v1.dlq}'
      KAFKA_CHAT_EVENTS_GROUP_ID: '${KAFKA_CHAT_EVENTS_GROUP_ID:-notification-chat-realtime}'
      KAFKA_CHAT_EVENTS_FROM_BEGINNING: '${KAFKA_CHAT_EVENTS_FROM_BEGINNING:-false}'
      KAFKA_USERNAME: '${KAFKA_USERNAME:-kafka}'
      KAFKA_PASSWORD: '${KAFKA_PASSWORD:?Set KAFKA_PASSWORD in Portainer}'
      KAFKA_SSL: '${KAFKA_SSL:-false}'

      MONGO_URI: '${MONGO_URI:?Set MONGO_URI in Portainer}'
      MONGO_DB_NAME: '${MONGO_DB_NAME:-noti_system_db}'
      REDIS_HOST: '${REDIS_HOST:-lens-redis}'
      REDIS_PORT: '${REDIS_PORT:-6379}'
      REDIS_DB: '${REDIS_DB:-1}'
      REDIS_PASSWORD: '${REDIS_PASSWORD:?Set REDIS_PASSWORD in Portainer}'

      KEYCLOAK_ISSUER: '${KEYCLOAK_ISSUER:?Set KEYCLOAK_ISSUER in Portainer}'
      KEYCLOAK_AUDIENCE: '${KEYCLOAK_AUDIENCE:?Set KEYCLOAK_AUDIENCE in Portainer}'
      KEYCLOAK_PUBLIC_KEY: '${KEYCLOAK_PUBLIC_KEY:?Set KEYCLOAK_PUBLIC_KEY in Portainer}'

      MAIL_PROVIDER_NAME: '${MAIL_PROVIDER_NAME:-mailgun}'
      MAILGUN_API_KEY: '${MAILGUN_API_KEY:-}'
      MAILGUN_BASE_URL: '${MAILGUN_BASE_URL:-https://api.mailgun.net}'
      MAILGUN_DOMAIN: '${MAILGUN_DOMAIN:-}'
      MAILGUN_FROM_EMAIL: '${MAILGUN_FROM_EMAIL:-}'
      SENDGRID_API_KEY: '${SENDGRID_API_KEY:-}'
      SENDGRID_FROM_EMAIL: '${SENDGRID_FROM_EMAIL:-}'
      SENDGRID_FROM_NAME: '${SENDGRID_FROM_NAME:-Notification System}'
    networks:
      - lens-network
    restart: unless-stopped

networks:
  lens-network:
    external: true
    name: lens-network
